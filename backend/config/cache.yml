default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

# Production uses :memory_store (config/environments/production.rb), with
# one database only; Solid Cache isn't used, so it gets no database of its own.
production:
  <<: *default
